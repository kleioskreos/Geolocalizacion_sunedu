# Archivo autónomo para Dokploy. No combinar con compose.yaml.
# Dokploy suministra las variables desde Environment.
name: mapa-prod
services:
  # The HTTP routers below use this middleware to send all public traffic to HTTPS.
  # It is declared on api because Traefik's Docker provider shares middleware labels.
  db:
    image: postgres:16-alpine
    command: ["postgres", "-p", "5544"]
    environment:
      POSTGRES_DB: geolocalizacion
      POSTGRES_USER: geolocalizacion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure esta variable en Environment de Dokploy}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p 5544 -U geolocalizacion -d geolocalizacion"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgres://geolocalizacion:${POSTGRES_PASSWORD}@db:5544/geolocalizacion?sslmode=disable
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Configure esta variable en Environment de Dokploy}
      INTEGRATION_API_KEY: ${INTEGRATION_API_KEY:-}
      FRONTEND_URL: ${FRONTEND_URL:-https://mapa.vmbperu.com}
      SEED_FILE: /data/escuelas.json
    expose:
      - "8091"
    networks:
      - default
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.middlewares.vmb-mapa-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.vmb-mapa-https-redirect.redirectscheme.permanent=true"
      - "traefik.http.services.vmb-mapa-api.loadbalancer.server.port=8091"
      - "traefik.http.routers.vmb-mapa-api-http.rule=Host(`mapabackend.vmbperu.com`)"
      - "traefik.http.routers.vmb-mapa-api-http.entrypoints=web"
      - "traefik.http.routers.vmb-mapa-api-http.middlewares=vmb-mapa-https-redirect"
      - "traefik.http.routers.vmb-mapa-api-https.rule=Host(`mapabackend.vmbperu.com`)"
      - "traefik.http.routers.vmb-mapa-api-https.entrypoints=websecure"
      - "traefik.http.routers.vmb-mapa-api-https.tls=true"
      - "traefik.http.routers.vmb-mapa-api-https.tls.certresolver=letsencrypt"
      - "traefik.http.routers.vmb-mapa-api-https.service=vmb-mapa-api"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8091/api/health"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  web:
    build:
      context: ./mapa-educativo-react
      args:
        VITE_API_URL: ${BACKEND_URL:-https://mapabackend.vmbperu.com}/api
    expose:
      - "8090"
    networks:
      - default
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.services.vmb-mapa-web.loadbalancer.server.port=8090"
      - "traefik.http.routers.vmb-mapa-web-http.rule=Host(`mapa.vmbperu.com`)"
      - "traefik.http.routers.vmb-mapa-web-http.entrypoints=web"
      - "traefik.http.routers.vmb-mapa-web-http.middlewares=vmb-mapa-https-redirect"
      - "traefik.http.routers.vmb-mapa-web-https.rule=Host(`mapa.vmbperu.com`)"
      - "traefik.http.routers.vmb-mapa-web-https.entrypoints=websecure"
      - "traefik.http.routers.vmb-mapa-web-https.tls=true"
      - "traefik.http.routers.vmb-mapa-web-https.tls.certresolver=letsencrypt"
      - "traefik.http.routers.vmb-mapa-web-https.service=vmb-mapa-web"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:

networks:
  dokploy-network:
    external: true
