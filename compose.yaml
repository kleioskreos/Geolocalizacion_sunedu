name: geolocalizacion-sunedu
services:
  db:
    image: postgres:16-alpine
    command: ["postgres", "-p", "5544"]
    environment:
      POSTGRES_DB: geolocalizacion
      POSTGRES_USER: geolocalizacion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Ejecute primero scripts/setup.ps1}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p 5544 -U geolocalizacion -d geolocalizacion"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgres://geolocalizacion:${POSTGRES_PASSWORD}@db:5544/geolocalizacion?sslmode=disable
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Ejecute primero scripts/setup.ps1}
      SEED_FILE: /data/escuelas.json
    volumes:
      - ./mapa-educativo-react/src/data/escuelas.json:/data/escuelas.json:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8091/api/health"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  web:
    build: ./mapa-educativo-react
    ports:
      - "127.0.0.1:${WEB_PORT:-8090}:8090"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
